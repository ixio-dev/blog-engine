{% extends "base.html" %}
{% block content %}
<section class="tag-page">
  <h1>Tag: {{ tag }}</h1>
  <ul class="post-list">
    {{ for post in posts }}
    <li class="post-list-item">
      <a class="post-link" href="{{ baseUrl }}/posts/{{ post.slug }}/">
        <h2 class="post-title">{{ post.title }}</h2>
      </a>
      <div class="post-meta">
        <time datetime="{{ post.date }}">{{ post.date_pretty }}</time>
      </div>
    </li>
    {{ endfor }}
  </ul>
</section>
{% endblock %}
